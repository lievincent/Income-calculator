<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Income Calculator</title>
<style>
:root{--bg:#050a1a;--bg2:#0a2a9c;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.18);--tx:#fff;--mut:#9fb4e8;--ac:#4aa3ff;--ok:#5be3a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3ff;--bg2:#b9d0ff;--card:rgba(255,255,255,.75);--line:rgba(10,40,150,.2);--tx:#0a1640;--mut:#40548f;--ac:#1456d6;--ok:#0a8a52}}
:root[data-theme="dark"]{--bg:#050a1a;--bg2:#0a2a9c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(900px 600px at 90% 10%,var(--bg2),transparent 70%),var(--bg);min-height:100vh}
main{max-width:860px;margin:auto;padding:20px 16px 40px}
h1{margin:0 0 16px;font-size:28px;letter-spacing:.5px}
h2{font-size:15px;margin:0 0 10px;color:var(--ac);text-transform:uppercase;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;backdrop-filter:blur(6px)}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;margin:10px 0}
label small{display:block;color:var(--mut);font-size:11px}
input{width:130px;padding:8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--tx);font-size:15px;text-align:right}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px;margin-top:8px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
td small{display:block;color:var(--mut);font-size:11px}
tr.tot td{font-weight:700;color:var(--ok)}tr.tot td small{color:var(--ok);opacity:.8}
.rt input{width:64px;padding:6px 4px;font-size:13px}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin-top:8px}
</style></head><body><main>
<h1>INCOME CALCULATOR</h1>
<div class="card"><h2>BE</h2>
<label><span>ALP personal / tahun (jt)<small>→ hanya Commission</small></span><input id="be" type="number" value="150" step="10"></label>
<div class="tw"><table id="tBE"></table></div></div>
<div class="card"><h2>BP</h2>
<label><span>ALP personal / tahun (jt)<small>→ Commission, ikut dihitung sebagai omset unit</small></span><input id="ap" type="number" value="300" step="10"></label>
<label><span>ALP unit murni / tahun (jt)<small>→ Overriding, omset BE di unit di luar personal</small></span><input id="au" type="number" value="600" step="10"></label>
<label><span>ALP grup / tahun (jt)<small>→ Royalty</small></span><input id="ag" type="number" value="2400" step="10"></label>
<div class="note" id="tot">&nbsp;</div>
<div class="tw"><table id="tBP"></table></div></div>
<div class="card"><details><summary style="cursor:pointer;list-style:none;margin:0"><h2 style="display:inline">Rate per tahun (%) ▾</h2></summary><div class="tw rt"><table id="tR"></table></div>
<div class="note">Commission BP thn 1-2 = 23.25% + (55% × 23.25%) = 36.0375%. Semua kolom bisa diubah.</div></details></div>
<div class="card"><h2>Total income BE + BP</h2><div class="tw"><table id="tT"></table></div>
<div class="note">ALP = premi bulanan × 12. Income per bulan = ALP × rate ÷ 12.</div></div>
</main>
<script>
const $=i=>document.getElementById(i),v=i=>parseFloat($(i).value)||0;
const f=x=>Math.abs(x)>=1000?(x/1000).toFixed(2)+" M":x.toFixed(1)+" jt";
const RT=[["be","Commission BE",[23.25,23.25,5,5,5]],["bp","Commission BP (personal)",[36.0375,36.0375,5,5,5]],["ov","Overriding (unit)",[12.8,12.8,0,0,0]],["ro","Royalty (grup)",[4.65,4.65,0,0,0]]];
$("tR").innerHTML="<tr><th></th>"+[1,2,3,4,5].map(y=>`<th>Thn ${y}</th>`).join("")+"</tr>"+RT.map(r=>`<tr><td>${r[1]}</td>`+r[2].map((d,i)=>`<td><input id="${r[0]}${i+1}" type="number" value="${d}" step="0.01"></td>`).join("")+"</tr>").join("");
const R=(k,y)=>v(k+y);
const hdr="<tr><th></th>"+[1,2,3,4,5].map(y=>`<th>Thn ${y}</th>`).join("")+"</tr>";
function tbl(id,S){const m=[0,0,0,0,0],yr=[0,0,0,0,0];
const rows=S.map(x=>`<tr><td>${x[0]} <small>${x[1]} jt ALP</small></td>`+[1,2,3,4,5].map(y=>{const a=x[1]*R(x[2],y)/100;m[y-1]+=a/12;yr[y-1]+=a;return`<td>${f(a/12)}<small>${f(a)}/thn · ${R(x[2],y)}%</small></td>`}).join("")+"</tr>").join("");
$(id).innerHTML=hdr+rows+"<tr class=\"tot\"><td>Total / bulan <small>/ tahun</small></td>"+m.map((a,i)=>`<td>${f(a)}<small>${f(yr[i])}/thn</small></td>`).join("")+"</tr>";return{m,yr}}
function run(){const e=tbl("tBE",[["Commission",v("be"),"be"]]);
const b=tbl("tBP",[["Commission (personal)",v("ap"),"bp"],["Overriding (unit)",v("au"),"ov"],["Royalty (grup)",v("ag"),"ro"]]);
$("tot").textContent="Omset unit total (personal + unit murni) = "+(v("ap")+v("au"))+" jt ALP / tahun";
const m=e.m.map((x,i)=>x+b.m[i]),y=e.yr.map((x,i)=>x+b.yr[i]),sum=y.reduce((a,x)=>a+x,0);
$("tT").innerHTML=hdr+"<tr class=\"tot\"><td>Income / bulan</td>"+m.map(x=>`<td>${f(x)}</td>`).join("")+"</tr><tr class=\"tot\"><td>Income / tahun</td>"+y.map(x=>`<td>${f(x)}</td>`).join("")+`</tr><tr><td>Total 5 tahun</td><td colspan="5" style="text-align:right">${f(sum)}</td></tr>`}
document.querySelectorAll("input").forEach(i=>i.oninput=run);run();
</script></body></html>
